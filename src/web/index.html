<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ktc-token" content="__KTC_TOKEN__">
<meta name="ktc-mode" content="__KTC_MODE__">
<title>Kill the C · 磁盘清理专家</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 品牌标识：一把刀把磁盘切成两半 -->
    <symbol id="i-logo" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3c3c44"/>
      <stop offset="0.42" stop-color="#1c1c21"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="ic-plate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="0.34" stop-color="#ccd1da"/>
      <stop offset="0.62" stop-color="#9aa0ac"/>
      <stop offset="1" stop-color="#6d737f"/>
    </linearGradient>
    <linearGradient id="ic-plateDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6bcc7"/>
      <stop offset="1" stop-color="#6b717d"/>
    </linearGradient>
    <linearGradient id="ic-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#dfe4ec"/>
      <stop offset="0.72" stop-color="#a8aeba"/>
      <stop offset="1" stop-color="#767c88"/>
    </linearGradient>
    <linearGradient id="ic-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ced8"/>
    </linearGradient>
    <linearGradient id="ic-handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="0.4" stop-color="#202027"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="ic-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff6a3d" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#ff9a3d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff5a2d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ic-spec" cx="0.32" cy="0.24" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ic-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="ic-soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <clipPath id="ic-cTop"><rect x="-10" y="-10" width="276" height="124"/></clipPath>
    <clipPath id="ic-cBot"><rect x="-10" y="140" width="276" height="140"/></clipPath>

    <g id="ic-disk">
      <circle cx="128" cy="128" r="76" fill="url(#ic-plate)"/>
      <circle cx="128" cy="128" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
      <circle cx="128" cy="128" r="76" fill="none" stroke="#3a3f48" stroke-opacity="0.35" stroke-width="3"/>
      <circle cx="128" cy="128" r="67" fill="none" stroke="#5d636e" stroke-opacity="0.5" stroke-width="1.4"/>
      <circle cx="128" cy="128" r="59" fill="url(#ic-plateDark)" fill-opacity="0.35"/>
      <circle cx="128" cy="128" r="59" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="128" cy="128" r="49" fill="none" stroke="#5d636e" stroke-opacity="0.42" stroke-width="1.2"/>
      <circle cx="128" cy="128" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1"/>
      <circle cx="128" cy="128" r="30" fill="url(#ic-plateDark)"/>
      <circle cx="128" cy="128" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="128" cy="128" r="14" fill="#17171c"/>
      <circle cx="128" cy="128" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="128" cy="128" r="7.5" fill="#0a0a0d"/>
      <g fill="#4d535d">
        <circle cx="187" cy="112" r="4"/>
        <circle cx="187" cy="150" r="4"/>
        <circle cx="69" cy="112" r="4"/>
        <circle cx="69" cy="150" r="4"/>
      </g>
      <circle cx="128" cy="128" r="76" fill="url(#ic-spec)"/>
    </g>
  </defs>

  <!-- 应用底板 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#ic-bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2"/>

  <g transform="rotate(45 128 128)">
    <!-- 上半块磁盘 -->
    <g clip-path="url(#ic-cTop)">
      <use href="#ic-disk"/>
    </g>
    <!-- 切口余温 -->
    <rect x="-10" y="112" width="276" height="7" fill="url(#ic-glow)" filter="url(#ic-soft)" transform="translate(0,14)"/>
    <!-- 下半块磁盘（沿切向错位） -->
    <g clip-path="url(#ic-cBot)" transform="translate(14,0)">
      <use href="#ic-disk"/>
      <rect x="34" y="138" width="220" height="2.6" fill="url(#ic-glow)" filter="url(#ic-soft2)"/>
    </g>
    <!-- 刀 -->
    <g>
      <rect x="0" y="109" width="58" height="40" rx="11" fill="url(#ic-handle)"/>
      <rect x="0" y="109" width="58" height="40" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.17" stroke-width="1.4"/>
      <rect x="7" y="114" width="44" height="4.6" rx="2.3" fill="#ffffff" fill-opacity="0.11"/>
      <circle cx="18" cy="129" r="3.3" fill="#0c0c10" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="40" cy="129" r="3.3" fill="#0c0c10" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <rect x="50" y="105" width="14" height="48" rx="4.5" fill="#8c929d"/>
      <rect x="50" y="105" width="14" height="48" rx="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
      <path d="M56 106 H196 L243 126 V132.6 L62 152 H56 Z" fill="url(#ic-blade)"/>
      <path d="M56 106 H196 L243 126 V129.6 L60 126.5 Z" fill="url(#ic-bevel)"/>
      <path d="M56 106 H196 L243 126" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-opacity="0.92"/>
      <path d="M62 152 L243 132.6 V126 L196 106" fill="none" stroke="#585e69" stroke-opacity="0.5" stroke-width="1.2"/>
      <path d="M64 129 H228" stroke="#6a707b" stroke-opacity="0.4" stroke-width="1.2"/>
    </g>
  </g>
</symbol>

    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></symbol>
    <symbol id="i-broom" viewBox="0 0 24 24"><path d="M14.7 3.3a1 1 0 0 1 1.4 0l3.6 3.6a1 1 0 0 1 0 1.4l-3.1 3.1-5-5 3.1-3.1ZM10.9 8.1l5 5-1.6 1.6-5-5 1.6-1.6ZM8.6 10.4l5 5-2.3 2.3c-.4.4-1.3 1.1-2.6 1.8-1.3.7-3 1.3-4.6 1.5.6-1.3 1.5-3 2.2-4.2.7-1.3 1-2 1.3-2.3l1-1.1Z" fill="currentColor"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2Z" fill="currentColor"/><path d="M12 6a6 6 0 1 0 6 6h-2a4 4 0 1 1-4-4V6Z" fill="currentColor" opacity=".7"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M13 3.1v8.3l6.6-6.6A9.9 9.9 0 0 0 13 3.1Z" fill="currentColor" opacity=".45"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 2h9a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-1v-2h1a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v1H6V5a3 3 0 0 1 3-3Z" fill="currentColor"/><rect x="3" y="7" width="14" height="15" rx="3" fill="currentColor"/><path d="M6 11h8v2H6v-2Zm0 4h6v2H6v-2Z" fill="#fff" opacity=".85"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v7c0 5 3.4 8.9 8 10 4.6-1.1 8-5 8-10V5l-8-3Z" fill="currentColor"/><path d="m9.2 12.2 2 2 4-4.2-1.4-1.4-2.6 2.7-.7-.7-1.3 1.6Z" fill="#fff"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M11 7h2v2h-2V7Zm0 4h2v7h-2v-7Z" fill="#fff"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3v2H6v3H4Zm16 0h-2V6h-3V4h3a2 2 0 0 1 2 2v3ZM4 15v3a2 2 0 0 0 2 2h3v-2H6v-3H4Zm16 0h-2v3h-3v2h3a2 2 0 0 0 2-2v-3ZM7 11h10v2H7v-2Z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 9Zm4 3v8h2v-8H10Zm4 0v8h2v-8h-2Z" fill="currentColor"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.9c.7 0 1.3.3 1.8.8l1 1.2h6.3A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11-1.5-1.4-8.6 9.4-3.5-3.5-1.4 1.5Z" fill="currentColor"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0-4h1v3h-2V2h1Zm0 17h1v3h-2v-3h1ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM5 6.4 6.4 5l2.1 2.1L7.1 8.5 5 6.4Zm11.5 11.5 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1Zm1.4-11.5L19.3 5l-2.1 2.1 1.4 1.4L19.9 6.4ZM5 17.9l2.1-2.1L8.5 17.2 6.4 19.3 5 17.9Z" fill="currentColor"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></symbol>
    <symbol id="i-caret" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6V6Z" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app hidden" id="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo"><use href="#i-logo"/></svg>
      <div>
        <h1>Kill the C</h1>
        <small id="brandSub">磁盘清理专家</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="mode-box">
        <div class="lbl">清理模式</div>
        <div class="seg wide" id="modeSeg"></div>
        <div class="dim" id="modeHint" style="font-size:11px;margin-top:7px;line-height:1.45"></div>
      </div>
      <div class="flexrow">
        <div class="admin-chip" id="adminChip"><span class="bulb"></span><span id="adminText">检测中</span></div>
        <div class="switch" id="themeSwitch" title="切换深浅色"></div>
      </div>
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>

<div class="uninst hidden" id="uninstRoot"></div>
<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script src="/assets/app.js"></script>
</body>
</html>
